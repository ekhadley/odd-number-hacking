<title>rollout viewer</title>
<style>
body { background: #16161e; color: #d4d4dc; font-family: monospace; font-size: 14px; margin: 0; height: 100vh; display: flex; overflow: hidden; }
#left { width: 290px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #3a3a4a; }
#search { background: #1e1e28; color: #d4d4dc; border: none; border-bottom: 1px solid #3a3a4a; font-family: monospace; font-size: 13px; padding: 6px 10px; outline: none; }
#runs { flex: 1; overflow-y: auto; }
#rollouts { width: 150px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid #3a3a4a; }
#main { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 24px; }
.item { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #22222e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item:hover { background: #22222e; }
.item.sel { background: #2a2a3a; }
.sub { color: #777; font-size: 12px; }
.odd { color: #ff7b5c; } .even { color: #8fd35f; } .unparsed { color: #777; }
#header { color: #777; font-size: 12px; margin-bottom: 14px; }
#textsearch { position: fixed; top: 10px; right: 24px; width: 220px; background: #1e1e28; color: #d4d4dc; border: 1px solid #3a3a4a; font-family: monospace; font-size: 13px; padding: 5px 10px; outline: none; }
mark { background: #e0c060; color: #16161e; }
.item.hit { background: #33301c; }
.item.hit:hover { background: #3d3924; }
.item.hit.sel { background: #4a4430; }
.msg { margin-bottom: 18px; }
.role { color: #777; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.text { white-space: pre-wrap; overflow-wrap: break-word; background: #1c1c26; border: 1px solid #3a3a4a; padding: 10px 14px; border-radius: 4px; line-height: 1.45; }
.reasoning .text { color: #9a9aa8; }
</style>
<div id="left"><input id="search" placeholder="filter runs" oninput="renderRuns()"><div id="runs"></div></div>
<div id="rollouts"></div>
<div id="main"></div>
<input id="textsearch" placeholder="highlight text" oninput="research()">
<script>
let runs = [], cur = null, sel = {run: -1, roll: -1};
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function hl(text) {
    const q = $('textsearch').value;
    if (!q) return esc(text);
    const lower = text.toLowerCase(), ql = q.toLowerCase();
    let out = '', pos = 0, idx;
    while ((idx = lower.indexOf(ql, pos)) !== -1) {
        out += esc(text.slice(pos, idx)) + '<mark>' + esc(text.slice(idx, idx + q.length)) + '</mark>';
        pos = idx + q.length;
    }
    return out + esc(text.slice(pos));
}
const countHits = (text, q) => { let n = 0, pos = 0; while ((pos = text.indexOf(q, pos)) !== -1) { n++; pos += q.length; } return n; };

function parseAnswer(content) {  // mirrors parse_answer in utils.py
    if (content == null) return null;
    const strip = s => s.trim().replace(/^\*+|\*+$/g, '').replace(/\.+$/, '').trim();
    const num = s => /^-?\d[\d,]*$/.test(s) ? s.replace(/,/g, '') : null;
    if (num(strip(content))) return num(strip(content));
    const bold = content.match(/\*\*(-?\d[\d,]*)\*\*/);
    if (bold) return bold[1].replace(/,/g, '');
    for (const line of content.split('\n')) if (num(strip(line))) return num(strip(line));
    const first = content.split('\n')[0].match(/-?\d[\d,]*/);
    return first ? first[0].replace(/,/g, '') : null;
}
const parity = ans => ans == null ? 'unparsed' : (ans[ans.length - 1] % 2 ? 'odd' : 'even');

const fmtTime = name => { const m = name.match(/(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)\d\d$/); return m ? `${m[2]}-${m[3]} ${m[4]}:${m[5]}` : ''; };

function renderRuns() {
    const q = $('search').value.toLowerCase();
    $('runs').innerHTML = runs.map((r, i) => q && !r.name.toLowerCase().includes(q) ? '' : `<div class="item ${i === sel.run ? 'sel' : ''}" onclick="selectRun(${i})">
        <div>${esc(r.model)}</div>
        <div class="sub">${fmtTime(r.name)} · ${r.n} samples${r.hack_rate ? ` · <span class="odd">${Math.round(r.hack_rate.rate * 100)}% odd</span>` : ''}</div></div>`).join('');
}

let order = [];
const rank = {odd: 0, even: 1, unparsed: 2};
function renderRollouts() {
    const q = $('textsearch').value.toLowerCase();
    order = cur.results.map((r, i) => {
        const msg = r.choices[0].message, ans = parseAnswer(msg.content);
        const hits = q ? countHits(`${msg.reasoning ?? ''}\n${msg.content ?? ''}`.toLowerCase(), q) : 0;
        return {i, ans, p: parity(ans), hits};
    });
    order.sort((a, b) => rank[a.p] - rank[b.p] || a.i - b.i);
    $('rollouts').innerHTML = order.map(({i, ans, p, hits}) => `<div class="item ${hits ? 'hit' : ''} ${i === sel.roll ? 'sel' : ''}" onclick="selectRollout(${i})"><span class="sub">${i}</span> <span class="${p}">${ans ?? '∅'}</span>${hits ? ` <span class="sub">×${hits}</span>` : ''}</div>`).join('');
}

async function selectRun(i) {
    sel.run = i; sel.roll = -1; renderRuns();
    $('rollouts').innerHTML = '<div class="item sub">loading…</div>'; $('main').innerHTML = '';
    cur = await (await fetch('/run/' + runs[i].name)).json();
    renderRollouts();
    selectRollout(order[0].i);
}

const block = (role, text, cls = '') => `<div class="msg ${cls}"><div class="role">${role}</div><div class="text">${hl(text)}</div></div>`;

function renderMain() {
    const r = cur.results[sel.roll], choice = r.choices[0], msg = choice.message;
    let h = `<div id="header">${esc(r.model)} · ${esc(r.provider ?? '?')} · ${new Date(r.created * 1000).toLocaleString()} · finish: ${esc(choice.finish_reason ?? '?')}</div>`;
    h += block('user', cur.metadata.prompt ?? '(prompt not saved)');
    if (msg.reasoning) h += block('reasoning', msg.reasoning, 'reasoning');
    h += block('assistant', msg.content ?? '(no content)');
    $('main').innerHTML = h;
}

function selectRollout(i) {
    sel.roll = i; renderRollouts(); renderMain();
    $('main').scrollTop = 0;
}

function research() { if (cur) { renderRollouts(); if (sel.roll >= 0) renderMain(); } }

(async () => { runs = await (await fetch('/runs')).json(); renderRuns(); if (runs.length) selectRun(0); })();
</script>
